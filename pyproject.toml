[project]
name = "pyfat"
version = "0.1.3"
description = "FAIR Implementation Profile for CLARIAH"
authors = [{name = "wilkos-dans"}, {name = "vicding-mi"}]
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
  "dynaconf==3.2.4",
  "pysolr==3.9.0",
  "setuptools==69.0.3",
  "simplejson==3.19.2",
  "emoji==2.10.1",
  "lxml==5.1.0",
  "elementpath==4.1.5",
  "pyyaml==6.0.1",
  "idutils==1.2.1",
  "saxonche==12.4.2",
  "rdflib==7.0.0",
  "toml==0.10.2",
  "uuid==1.30"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Repository = "https://github.com/CLARIAH/pyFAT.git"
Issues = "https://github.com/CLARIAH/pyFAT/issues"