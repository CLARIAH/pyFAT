[tool.poetry]
name = "pyFAT"
version = "0.1.3"
description = "FAIR Implementation Profile for CLARIAH"
authors = ["wilkos-dans", ""]
readme = "README.md"
packages = [{include = "pyfat", from = "src"}]
#package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
dynaconf = "^3.2.4"
pysolr = "^3.9.0"
setuptools = "^69.0.3"
simplejson = "^3.19.2"
emoji = "^2.10.1"
lxml = "^5.1.0"
elementpath = "^4.1.5"
pyyaml = "^6.0.1"
idutils = "^1.2.1"
saxonche = "^12.4.2"
rdflib = "^7.0.0"
toml = "^0.10.2"
uuid = "^1.30"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project.urls]
#Homepage = "https://example.com"
#Documentation = "https://readthedocs.org"
Repository = "https://github.com/CLARIAH/pyFAT.git"
Issues = "https://github.com/CLARIAH/pyFAT/issues"
